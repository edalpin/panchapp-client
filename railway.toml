[build]
builder = "RAILPACK"
buildCommand = "pnpm build"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"

# Client service env (set in Railway dashboard):
#   EXPO_PUBLIC_GRAPHQL_URL=/graphql
#   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=<web oauth client id>
#   RAILPACK_SPA_OUTPUT_DIR=dist
#   API_PRIVATE_HOST=${{<api-service>.RAILWAY_PRIVATE_DOMAIN}}
#   API_PORT=3000
